[project]
name = "finrex-backend"
version = "0.1.0"
description = "FinRex - AI 预测引擎"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "FinRex Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    # LLM 相关
    "openai>=1.0.0",
    # Zep Cloud
    "zep-cloud==3.13.0",
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "ccxt>=4.5.54",
    "yfinance>=1.3.0",
    "lightgbm>=4.6.0",
    "akshare>=1.18.61",
    "pyarrow>=24.0.0",
    "sqlalchemy>=2.0.0",
    # Foundation price forecasting (Kronos + Chronos-Bolt)
    "torch>=2.0.0",
    "chronos-forecasting>=2.2.2",
    "einops>=0.8.1",
    "huggingface-hub>=0.33.1",
    "safetensors>=0.6.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
